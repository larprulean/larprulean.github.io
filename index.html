<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cerulean</title>
  <meta name="description" content="cerulean — links.">
  <link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- the scene: drawn once as a symbol, used full-bleed and again (cropped, mono) in the torn panel -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2c2a40"/>
        <stop offset=".45" stop-color="#5d5883"/>
        <stop offset=".72" stop-color="#9c96bd"/>
        <stop offset="1" stop-color="#b9b3d2"/>
      </linearGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
      <pattern id="fence" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <path d="M0 0H16M0 0V16" stroke="#b9b3d2" stroke-width="1.6" fill="none" opacity=".75"/>
      </pattern>
      <symbol id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
        <rect width="1600" height="1000" fill="url(#sky)"/>
        <!-- clouds -->
        <g filter="url(#soft)" opacity=".55">
          <ellipse cx="380" cy="230" rx="320" ry="60" fill="#3a3654"/>
          <ellipse cx="1020" cy="170" rx="380" ry="70" fill="#34304c"/>
          <ellipse cx="760" cy="420" rx="420" ry="50" fill="#7d77a3"/>
          <ellipse cx="1300" cy="460" rx="300" ry="40" fill="#8a84ad"/>
        </g>

        <!-- power lines -->
        <g fill="none" stroke="#14121c" stroke-width="2.2" opacity=".9">
          <path d="M-20 120 Q 420 300 760 380 T 1620 300"/>
          <path d="M-20 170 Q 420 330 760 400 T 1620 340"/>
          <path d="M-20 60 Q 500 260 760 360 T 1620 250"/>
          <path d="M-20 260 Q 400 420 690 470 T 1620 430"/>
          <path d="M120 -20 Q 300 260 690 470"/>
          <path d="M-20 520 Q 300 470 690 470"/>
          <path d="M760 380 Q 1100 520 1620 560" stroke-width="1.6"/>
        </g>

        <!-- transmission tower -->
        <g fill="none" stroke="#14121c" stroke-width="3" stroke-linejoin="round">
          <path d="M650 720 L700 360 L740 360 L790 720"/>
          <path d="M670 580 H770 M660 640 H780 M682 500 H758 M692 430 H748"/>
          <path d="M650 720 L770 580 L660 640 L758 500 L682 500 L748 430 L692 430 L740 360"/>
          <path d="M790 720 L670 580 L780 640 L682 500 M758 500 L692 430 M748 430 L700 360"/>
          <path d="M600 470 H840 M620 410 H820"/>
          <path d="M600 470 L690 470 M750 470 L840 470 M600 470 L612 492 M840 470 L828 492 M620 410 L632 430 M820 410 L808 430"/>
          <path d="M700 360 L720 320 L740 360"/>
        </g>
        <!-- second pylon, far -->
        <g fill="none" stroke="#1d1a29" stroke-width="2" opacity=".8">
          <path d="M1230 690 L1256 480 L1276 480 L1302 690"/>
          <path d="M1240 610 H1292 M1248 550 H1284 M1210 520 H1322"/>
          <path d="M1230 690 L1292 610 L1240 610 L1284 550 L1248 550 L1276 480"/>
        </g>

        <!-- rooftops / buildings -->
        <g fill="#16141f">
          <path d="M0 640 H210 V610 H330 V660 H470 V700 H0 Z"/>
          <rect x="980" y="590" width="300" height="120"/>
          <rect x="1010" y="560" width="70" height="30"/>
          <path d="M1280 630 H1600 V700 H1280 Z"/>
          <rect x="1420" y="580" width="18" height="50"/>
          <rect x="0" y="690" width="1600" height="310"/>
        </g>
        <!-- water tower -->
        <g fill="#16141f">
          <rect x="1110" y="470" width="90" height="56" rx="8"/>
          <path d="M1104 470 L1155 440 L1206 470 Z"/>
          <path d="M1120 526 L1110 590 M1190 526 L1200 590 M1155 526 V590" stroke="#16141f" stroke-width="5"/>
        </g>
        <!-- railings on the roof -->
        <g stroke="#16141f" stroke-width="3">
          <path d="M210 600 H330 M220 600 V610 M250 600 V610 M280 600 V610 M310 600 V610"/>
          <path d="M980 578 H1280 M1000 578 V590 M1060 578 V590 M1120 578 V590 M1180 578 V590 M1240 578 V590"/>
        </g>

        <!-- chain-link fence -->
        <rect x="140" y="720" width="900" height="170" fill="url(#fence)"/>
        <g stroke="#0e0d14" stroke-width="7">
          <path d="M140 712 V900 M440 712 V900 M740 712 V900 M1040 712 V900"/>
          <path d="M140 718 H1040" stroke-width="5"/>
        </g>
        <!-- ground -->
        <rect x="0" y="890" width="1600" height="110" fill="#0e0d14"/>
      </symbol>
    </defs>
  </svg>

  <div class="scene" aria-hidden="true"><svg><use href="#scene"/></svg></div>

  <!-- torn photocopy panel -->
  <div class="panel" aria-hidden="true">
    <svg class="panel-art" viewBox="560 280 420 700" preserveAspectRatio="xMidYMid slice"><use href="#scene" width="1600" height="1000"/></svg>
    <div class="panel-dots"></div>
  </div>
  <div class="tape" aria-hidden="true"></div>

  <div class="grain" aria-hidden="true"></div>

  <main class="cover">
    <div class="masthead">
      <h1 class="title">cerulean</h1>
      <p class="strip handle">larprulean</p>
    </div>

    <ul class="links">
      <li><a class="strip link" href="https://github.com/larprulean" target="_blank" rel="noopener">github</a></li>
      <li><a class="strip link" href="https://www.linkedin.com/in/cameron-crawford-57b349375" target="_blank" rel="noopener">linkedin</a></li>
    </ul>
  </main>
</body>
</html>
