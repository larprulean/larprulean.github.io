name: Update ye tracker data

on:
  schedule:
    - cron: "17 9 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python scripts/scrape_tracker.py tracker/data.json
      - name: Commit if songs changed
        run: |
          # ignore the "updated" timestamp so we only commit real changes
          if git diff --quiet -I '"updated"' -- tracker/data.json; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tracker/data.json
          git commit -m "Update ye tracker data"
          git push
